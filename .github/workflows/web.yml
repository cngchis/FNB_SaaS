name: Web

on:
  push:
    paths: ['src/**', 'public/**', 'tests/**', 'scripts/**', 'apps/api/**', 'package*.json', '*config*', 'index.html', '.github/workflows/web.yml']
  pull_request:
    paths: ['src/**', 'public/**', 'tests/**', 'scripts/**', 'apps/api/**', 'package*.json', '*config*', 'index.html', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Never regenerate snapshots in CI; a visual difference must fail the job.
      - run: npm run test:visual
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/api/go.sum
      - name: Install native PostgreSQL 16 fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
        working-directory: apps/api
      - name: Browser to API to PostgreSQL integration
        run: bash scripts/test-web-api-local.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-results
          path: test-results/
          retention-days: 7
