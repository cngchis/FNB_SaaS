name: Web

on:
  push:
    paths: ['src/**', 'public/**', 'tests/**', 'package*.json', '*config*', 'index.html', '.github/workflows/web.yml']
  pull_request:
    paths: ['src/**', 'public/**', 'tests/**', 'package*.json', '*config*', 'index.html', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Never regenerate snapshots in CI; a visual difference must fail the job.
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-results
          path: test-results/
          retention-days: 7
